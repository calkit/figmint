[project]
# A real project environment, so `uv run` has a lock file for figmint to record
# as an input. That is not incidental: the same script under a different NumPy
# fits a slightly different polynomial, and the lock is what makes that visible
# rather than assumed.
#
# Neither astra nor figmint is in here. Both wrap the work from the outside —
# astra describes it, figmint records it — so both belong on your PATH as tools
# rather than in the environment the science runs in.
name = "figmint-astra-example"
version = "0.1.0"
description = "ASTRA analysis whose artifacts carry their provenance"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "plotly>=5.22",
    "kaleido>=0.2",
    # For the little runner in src/run.py, which reads astra.yaml and the
    # universe. ASTRA deliberately does not execute recipes.
    "pyyaml>=6.0",
]
