# The pipeline. figmint references these stages; it never defines or runs them.
# Data that came from outside the project. Declaring it here is what makes the
# provenance chain complete: without it the figure is a verified pipeline output
# whose own input appeared from nowhere, which `figmint check` reports as an
# unaccounted chain root.
datasets:
  performance:
    path: data/performance.csv
    title: Measured turbine performance
    description: >-
      Power coefficient against tip speed ratio, from towing-tank measurements.
      Synthetic values for this example.
    imported_from:
      doi: 10.222.2222rje

environments:
  main:
    kind: uv
    path: pyproject.toml
    python: "3.12"

pipeline:
  stages:
    # 1. An ordinary plotting script. It knows nothing about figmint.
    plot-cp:
      kind: python-script
      script_path: scripts/plot_cp.py
      environment: main
      inputs:
        - data/performance.csv
      outputs:
        - path: figures/cp_curve.svg
          storage: git

    # 2. Re-embed changed components into the diagram.
    #
    # The authored diagram and the published picture have to be two different
    # files. `figures/composite.drawio` is the one a human edits; it is a source,
    # and no stage writes it. `figures/composite.drawio.svg` is derived, and no
    # human should edit it. Collapsing them into one file — which is tempting,
    # because a `.drawio.svg` really is both editable and viewable — makes it a
    # dependency and an output of the same pipeline, and DVC rejects that as a
    # cycle. It is right to reject it: a file regenerated from itself would
    # silently destroy hand edits on the next run.
    #
    # Split from the render step for a second reason: `-o` keeps `reimport` from
    # reading and writing the same path.
    embed-figure:
      kind: command
      command: figmint reimport figures/composite.drawio -o .build/composite.drawio
      environment: main
      inputs:
        - figures/composite.drawio
        - from_stage_outputs: plot-cp
        # An imported panel is a real dependency too: replace the file and the
        # embedded copy goes stale exactly like a regenerated plot. It is listed
        # by path rather than by stage because nothing in this project produces
        # it — `figures/turbine.png.prov.yaml` is the only claim about it.
        - figures/turbine.png
      outputs:
        - path: .build/composite.drawio
          storage: git

    # 3. draw.io re-renders the picture around the updated diagram. figmint
    #    cannot do this itself, which is exactly why the handoff exists.
    #
    #    Note this is the one stage whose tool is not in the environment:
    #    draw.io is a desktop app, so `main` cannot pin it. A `docker`
    #    environment would close that gap if the pipeline needs to be hermetic.
    render-figure:
      kind: command
      command: >-
        drawio -x -f svg --embed-diagram --yes
        -o figures/composite.drawio.svg .build/composite.drawio
      # `--embed-diagram` is what makes the output still carry `src` and `hash`:
      # a plain SVG export keeps the picture and drops the shape metadata, so
      # `figmint check` would have nothing to read.
      environment: main
      inputs:
        - from_stage_outputs: embed-figure
      outputs:
        - path: figures/composite.drawio.svg
          storage: git

    # 4. Refuse to publish a figure whose components are not identified.
    check-provenance:
      kind: command
      command: figmint check figures/composite.drawio.svg
      environment: main
      inputs:
        - from_stage_outputs: render-figure
      always_run: true

    # 5. Build the document.
    #
    # Deliberately declares no outputs. MyST assigns random node keys on every
    # build, so `_build/` never hashes the same twice — declaring it would leave
    # the stage permanently dirty and tell you nothing. Tracking buys nothing
    # here; running it last is the point.
    build-site:
      kind: command
      command: myst build --html --execute
      environment: main
      inputs:
        - index.md
        - myst.yml
        - from_stage_outputs: render-figure
      always_run: true
