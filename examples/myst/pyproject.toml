[project]
# A real project environment for the example, so `uv run figmint …` works here
# and Calkit has an environment it can lock. figmint comes from the repo two
# levels up, editable, so changes to the tool are picked up immediately.
name = "figmint-myst-example"
version = "0.1.0"
description = "MyST document driven by figmint-tracked figures"
requires-python = ">=3.12"
dependencies = [
    "figmint",
    "matplotlib>=3.8",
    # mystmd ships on PyPI as a wrapper around the Node CLI, so the document
    # builder can live in the same environment as everything else — which is
    # what makes the `build-site` pipeline stage reproducible rather than
    # dependent on whatever `myst` happens to be on PATH.
    "mystmd>=1.6",
    # Lets MyST execute `{code-cell}` blocks at build time, so a figure can
    # be computed by the document itself rather than by a pipeline stage.
    # `jupyter-server` is not optional: mystmd talks to a server, not to a
    # kernel directly, and without it execution fails at build time.
    "ipykernel>=6.29",
    "jupyter-server>=2.14",
]

[tool.uv.sources]
figmint = { path = "../..", editable = true }

# The Stencila SDK, enabling `:graph:` on the figmint directive.
#
# In its own group because it compiles a slice of Stencila's Rust workspace —
# several minutes on a cold cache — but listed in `default-groups` because it
# has to be. `uv run` re-syncs the environment to the default groups, so a
# non-default group is uninstalled the moment `calkit run` invokes a stage
# through `calkit xenv`, and the published document silently loses its graph.
#
# Drop it from `default-groups` to make the example install fast again; the
# panel then reports the graph as unavailable and nothing else changes.
[dependency-groups]
stencila = ["stencila", "stencila-types"]

[tool.uv]
default-groups = ["stencila"]

[tool.uv.sources.stencila]
path = "../../../stencila/python/stencila"
editable = true

[tool.uv.sources.stencila-types]
path = "../../../stencila/python/stencila_types"
editable = true
