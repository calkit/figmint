version: 1
project:
  id: fromwhere-example
  title: fromwhere + MyST
  # Renders `:::{fromwhere}` blocks. An executable plugin, so the document is
  # built by the same code that answers `fromwhere status` rather than a
  # reimplementation of it in JavaScript.
  plugins:
    - type: executable
      path: ./.venv/bin/fromwhere-myst
  toc:
    - file: index.md
site:
  template: book-theme
