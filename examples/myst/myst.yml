version: 1
project:
  id: figmint-example
  title: figmint + MyST
  # Renders `:::{figmint}` blocks. An executable plugin, so the document is
  # built by the same code that answers `figmint status` rather than a
  # reimplementation of it in JavaScript.
  plugins:
    - type: executable
      path: ./.venv/bin/figmint-myst
  toc:
    - file: index.md
site:
  template: book-theme
