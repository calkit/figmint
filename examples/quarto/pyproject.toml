[project]
# A real project environment, so `uv run` has a lock file for figmint to record
# as an input. That is not incidental: the same script under a different
# Plotly draws a different figure, and the lock is what makes that visible.
name = "figmint-quarto-example"
version = "0.1.0"
description = "Quarto document whose figures carry their provenance"
requires-python = ">=3.12"
dependencies = [
    "figmint-fresh",
    # SVG rather than PNG, and not for looks: an SVG can carry Content
    # Credentials, so the panels arrive at the composite already signed.
    # Plotly needs kaleido to write a static image at all.
    "plotly>=5.22",
    "kaleido>=0.2",
]

[tool.uv.sources]
figmint-fresh = { path = "../..", editable = true }
