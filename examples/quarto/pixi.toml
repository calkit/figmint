# Everything this document needs, in one lock file — which is the whole reason
# for using pixi here rather than uv, as the MyST example does.
#
# `quarto` is the point. Rendering the document is a recorded step, and figmint
# records `pixi.lock` as its environment; if Quarto came from a system install
# that lock would be asserting an environment it does not actually pin, and the
# record would be claiming more than it knows. A different Quarto renders a
# different page, exactly as a different Plotly draws a different figure.
[workspace]
name = "figmint-quarto-example"
description = "Quarto document whose figures carry their provenance"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]

[dependencies]
python = ">=3.12"
quarto = ">=1.8"
plotly = ">=5.22"
# kaleido is what writes a static image at all; without it Plotly can only
# produce HTML.
python-kaleido = "*"

# figmint is not on conda-forge, and this example is inside its own repository,
# so it is installed from the checkout. In a real project this would be
# `figmint-fresh = "*"` from PyPI.
[pypi-dependencies]
figmint-fresh = { path = "../..", editable = true }
