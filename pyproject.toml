[project]
name = "figmint"
# Taken from the git tag by hatch-vcs, so a release is cut by tagging and
# there is no version to forget to bump.
dynamic = ["version"]
description = "Create fresh figures."
readme = "README.md"
authors = [
    { name = "Pete Bachant", email = "petebachant@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "c2pa-python>=0.37.2",
    "cryptography>=49.0.0",
]

[project.scripts]
figmint = "figmint.cli:main"
# The MyST executable-plugin entry point. mystmd spawns this by path, so it has
# to exist as a real executable file rather than a `figmint myst` subcommand.
figmint-myst = "figmint.myst:main"

[build-system]
requires = ["hatchling>=1.5.0", "hatch-vcs>=0.3.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
tag-pattern = "^v(?P<version>.+)$"

[tool.hatch.version.raw-options]
# `--match v[0-9]*` so only release tags are considered; any other tag on the
# history would otherwise be read as a version.
git_describe_command = [
    "git",
    "describe",
    "--dirty",
    "--tags",
    "--long",
    "--match",
    "v[0-9]*",
]

[tool.hatch.build.targets.wheel]
packages = ["src/figmint"]

[tool.hatch.build.targets.sdist]
# Named explicitly because hatchling otherwise ships everything git tracks,
# and the MyST example's figures are several megabytes of it.
# Anchored with a leading slash: the patterns are gitignore-style, so a bare
# `README.md` would also pull in the example's.
include = [
    "/src/figmint",
    "/tests",
    "/docs",
    "/README.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.1",
    "mypy>=1.11.2",
    "numpy>=2.5.1",
    "pre-commit>=3.8.0",
    "pytest>=9.1.1",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
# Only this repo's tests. The example is a self-contained project with its own
# environment and its own suite.
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/figmint"]

[tool.coverage.report]
skip_empty = true

[tool.mypy]
files = ["src/figmint"]
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

# c2pa-python ships no type stubs and no py.typed marker.
[[tool.mypy.overrides]]
module = ["c2pa"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 79
fix = true

[tool.ruff.lint]
extend-select = ["I"]  # Import sorting (isort compatibility)
